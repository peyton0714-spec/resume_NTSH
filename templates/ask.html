<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中韓中日翻譯</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
        }

        section {
            margin: 20px;
        }

        .form-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        input, select {
            padding: 8px;
            margin-top: 5px;
            font-size: 16px;
        }

        input[type="submit"],
        input[type="button"] {
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>中韓中日翻譯系統</h1>
    </header>

    <section>
        <div class="form-box">

            <form method="POST" action="/ask">

                <!-- 選擇翻譯語言 -->
                <label for="language">選擇語言：</label><br>

                <select name="language" id="language">
                    <option value="ko" {% if language == 'ko' %}selected{% endif %}>韓文</option>
                    <option value="jp" {% if language == 'jp' %}selected{% endif %}>日文</option>
                </select>

                <br><br>

                <!-- 輸入中文 -->
                <label for="question">請輸入中文：</label><br>

                <input
                    type="text"
                    id="question"
                    name="question"
                    value="{{ question }}"
                    required
                >

                <br><br>

                <!-- 翻譯按鈕 -->
                <input type="submit" value="翻譯">

                <input
                    type="button"
                    value="回首頁"
                    onclick="window.location.href='/'"
                >

            </form>

            <!-- 顯示翻譯結果 -->
            {% if answer %}

            <div class="result">

                <h2>翻譯結果</h2>

                <p>中文：{{ question }}</p>

                <p>翻譯：{{ answer }}</p>

            </div>

            {% endif %}

        </div>
    </section>

</body>
</html>
